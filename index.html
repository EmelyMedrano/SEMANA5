<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evaluación de Frutas</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff5df, #f8fff8);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .contenedor {
            width: 100%;
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #555;
            margin-bottom: 25px;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1b5e20;
        }

        .boton-rojo {
            background-color: #c62828;
        }

        .boton-rojo:hover {
            background-color: #8e0000;
        }

        /* ZONA PARA ARRASTRAR */

        .zona-drop {
            border: 3px dashed #4caf50;
            border-radius: 15px;
            padding: 35px 20px;
            margin: 20px 0;
            background-color: #f8fff8;
            cursor: pointer;
            transition: 0.3s;
        }

        .zona-drop:hover {
            background-color: #e8f5e9;
        }

        .zona-drop.activa {
            background-color: #c8e6c9;
            border-color: #1b5e20;
        }

        .zona-drop h3 {
            color: #2e7d32;
        }

        .icono-subir {
            font-size: 45px;
        }

        /* IMAGEN */

        #imagen {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            display: none;
            margin: 20px auto;
        }

        /* CÁMARA */

        #webcam-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        canvas {
            max-width: 100%;
            border-radius: 15px;
        }

        /* RESULTADO */

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background-color: #f1f8e9;
        }

        #resultado h2 {
            margin-top: 0;
        }

        #resultadoTexto {
            font-size: 25px;
            font-weight: bold;
        }

        .resultado-verde {
            background-color: #e8f5e9 !important;
            color: #2e7d32;
        }

        .resultado-amarillo {
            background-color: #fff8e1 !important;
            color: #f57f17;
        }

        .resultado-rojo {
            background-color: #ffebee !important;
            color: #c62828;
        }

        /* PREDICCIONES */

        #predicciones {
            margin-top: 20px;
            text-align: left;
        }

        .prediccion {
            margin: 15px 0;
        }

        .barra {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progreso {
            height: 100%;
            background-color: #4caf50;
            border-radius: 10px;
            transition: width 0.3s;
        }

        #estado {
            margin: 15px;
            color: #666;
        }

        #error {
            color: #c62828;
            background-color: #ffebee;
            padding: 12px;
            border-radius: 10px;
            display: none;
            margin-top: 15px;
        }

        @media (max-width: 600px) {

            .contenedor {
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="contenedor">

    <h1>🍎 Evaluación de Frutas</h1>

    <p class="descripcion">
        Sube una imagen, arrástrala al área indicada
        o utiliza la cámara para evaluar el estado de la fruta.
    </p>


    <!-- BOTONES -->

    <div class="botones">

        <button onclick="seleccionarImagen()">
            🖼️ Subir imagen
        </button>

        <button onclick="iniciarCamara()">
            📷 Usar cámara
        </button>

        <button
            class="boton-rojo"
            onclick="detenerCamara()">
            ⛔ Detener cámara
        </button>

    </div>


    <!-- INPUT DE IMAGEN -->

    <input
        type="file"
        id="archivo"
        accept="image/*"
        style="display:none"
    >


    <!-- ZONA DRAG AND DROP -->

    <div
        id="zonaDrop"
        class="zona-drop">

        <div class="icono-subir">
            📤
        </div>

        <h3>
            Arrastra una imagen aquí
        </h3>

        <p>
            o haz clic para seleccionar una imagen
        </p>

        <p>
            JPG · PNG · JPEG · WEBP
        </p>

    </div>


    <!-- ESTADO -->

    <p id="estado">
        Esperando una imagen...
    </p>


    <!-- IMAGEN SUBIDA -->

    <img
        id="imagen"
        alt="Imagen de la fruta"
    >


    <!-- CÁMARA -->

    <div id="webcam-container"></div>


    <!-- RESULTADO -->

    <div id="resultado">

        <h2>Resultado</h2>

        <p id="resultadoTexto">
            Esperando una fruta...
        </p>

    </div>


    <!-- PORCENTAJES -->

    <div id="predicciones"></div>


    <!-- ERROR -->

    <div id="error"></div>

</div>


<script>

    // =====================================================
    // CONFIGURACIÓN DEL MODELO
    // =====================================================

    const MODEL_URL =
        "https://teachablemachine.withgoogle.com/models/Gezzx2Ug_/";


    let model = null;

    let maxPredictions = 0;

    let webcam = null;

    let ejecutando = false;


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const archivo =
        document.getElementById("archivo");

    const zonaDrop =
        document.getElementById("zonaDrop");

    const imagen =
        document.getElementById("imagen");

    const estado =
        document.getElementById("estado");

    const errorElemento =
        document.getElementById("error");


    // =====================================================
    // MOSTRAR ERROR
    // =====================================================

    function mostrarError(error) {

        console.error(error);

        errorElemento.style.display = "block";

        errorElemento.innerText =
            "Error: " + error.message;

        estado.innerText =
            "No se pudo analizar la imagen.";

    }


    // =====================================================
    // CARGAR MODELO
    // =====================================================

    async function cargarModelo() {

        if (model !== null) {
            return;
        }


        estado.innerText =
            "Cargando modelo de inteligencia artificial...";


        const modelURL =
            MODEL_URL + "model.json";

        const metadataURL =
            MODEL_URL + "metadata.json";


        model = await tmImage.load(
            modelURL,
            metadataURL
        );


        maxPredictions =
            model.getTotalClasses();


        console.log(
            "Modelo cargado correctamente."
        );

        console.log(
            "Número de clases:",
            maxPredictions
        );

        console.log(
            "Clases:",
            model.getClassLabels()
        );

    }


    // =====================================================
    // SELECCIONAR IMAGEN
    // =====================================================

    function seleccionarImagen() {

        archivo.click();

    }


    archivo.addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (file) {

                procesarImagen(file);

            }

        }
    );


    // =====================================================
    // PROCESAR IMAGEN
    // =====================================================

    async function procesarImagen(file) {

        try {

            errorElemento.style.display =
                "none";


            if (!file.type.startsWith("image/")) {

                throw new Error(
                    "El archivo seleccionado no es una imagen."
                );

            }


            // Detener cámara

            detenerCamara();


            // Cargar modelo

            await cargarModelo();


            estado.innerText =
                "Cargando imagen...";


            // Crear URL de la imagen

            const imagenURL =
                window.URL.createObjectURL(file);


            imagen.src =
                imagenURL;


            imagen.style.display =
                "block";


            // Esperar a que cargue

            await new Promise(
                function(resolve, reject) {

                    imagen.onload = resolve;

                    imagen.onerror = function() {

                        reject(
                            new Error(
                                "No se pudo cargar la imagen."
                            )
                        );

                    };

                }
            );


            estado.innerText =
                "🤖 Analizando fruta...";


            // =================================================
            // CREAR CANVAS
            // =================================================

            const canvas =
                document.createElement("canvas");


            const contexto =
                canvas.getContext("2d");


            const ancho =
                imagen.naturalWidth;

            const alto =
                imagen.naturalHeight;


            canvas.width =
                ancho;

            canvas.height =
                alto;


            contexto.drawImage(
                imagen,
                0,
                0,
                ancho,
                alto
            );


            // =================================================
            // REALIZAR PREDICCIÓN
            // =================================================

            const predicciones =
                await model.predict(canvas);


            mostrarResultados(
                predicciones
            );


            estado.innerText =
                "✅ Evaluación completada.";


            // Liberar memoria

            window.URL.revokeObjectURL(
                imagenURL
            );

        }

        catch(error) {

            mostrarError(error);

        }

    }


    // =====================================================
    // MOSTRAR RESULTADOS
    // =====================================================

    function mostrarResultados(predicciones) {

        let claseMayor = "";

        let confianzaMayor = 0;


        const contenedor =
            document.getElementById(
                "predicciones"
            );


        contenedor.innerHTML = "";


        for (
            let i = 0;
            i < predicciones.length;
            i++
        ) {

            const nombre =
                predicciones[i].className;


            const confianza =
                predicciones[i].probability;


            const porcentaje =
                confianza * 100;


            // Buscar mayor probabilidad

            if (
                confianza >
                confianzaMayor
            ) {

                confianzaMayor =
                    confianza;

                claseMayor =
                    nombre;

            }


            // Crear barra

            const div =
                document.createElement("div");


            div.className =
                "prediccion";


            div.innerHTML = `

                <strong>
                    ${nombre}:
                    ${porcentaje.toFixed(2)}%
                </strong>

                <div class="barra">

                    <div
                        class="progreso"
                        style="width:${porcentaje}%">
                    </div>

                </div>

            `;


            contenedor.appendChild(div);

        }


        mostrarResultadoPrincipal(
            claseMayor,
            confianzaMayor
        );

    }


    // =====================================================
    // MOSTRAR RESULTADO PRINCIPAL
    // =====================================================

    function mostrarResultadoPrincipal(
        clase,
        confianza
    ) {

        const resultado =
            document.getElementById(
                "resultado"
            );


        const texto =
            document.getElementById(
                "resultadoTexto"
            );


        resultado.classList.remove(
            "resultado-verde",
            "resultado-amarillo",
            "resultado-rojo"
        );


        const nombre =
            clase.toLowerCase();


        // MALOGRADA

        if (
            nombre.includes("malograd") ||
            nombre.includes("podrid") ||
            nombre.includes("dañad") ||
            nombre.includes("dañada")
        ) {

            resultado.classList.add(
                "resultado-rojo"
            );


            texto.innerHTML = `
                🔴 ${clase}
                <br>
                <small>
                    Confianza:
                    ${(confianza * 100).toFixed(2)}%
                </small>
            `;

        }


        // VERDE

        else if (
            nombre.includes("verde")
        ) {

            resultado.classList.add(
                "resultado-verde"
            );


            texto.innerHTML = `
                🟢 ${clase}
                <br>
                <small>
                    Confianza:
                    ${(confianza * 100).toFixed(2)}%
                </small>
            `;

        }


        // SIN MADURAR

        else {

            resultado.classList.add(
                "resultado-amarillo"
            );


            texto.innerHTML = `
                🟡 ${clase}
                <br>
                <small>
                    Confianza:
                    ${(confianza * 100).toFixed(2)}%
                </small>
            `;

        }

    }


    // =====================================================
    // DRAG AND DROP
    // =====================================================

    zonaDrop.addEventListener(
        "click",
        seleccionarImagen
    );


    zonaDrop.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();

            zonaDrop.classList.add(
                "activa"
            );

        }
    );


    zonaDrop.addEventListener(
        "dragleave",
        function() {

            zonaDrop.classList.remove(
                "activa"
            );

        }
    );


    zonaDrop.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();


            zonaDrop.classList.remove(
                "activa"
            );


            const files =
                event.dataTransfer.files;


            if (
                files.length === 0
            ) {

                return;

            }


            procesarImagen(
                files[0]
            );

        }
    );


    // =====================================================
    // INICIAR CÁMARA
    // =====================================================

    async function iniciarCamara() {

        try {

            errorElemento.style.display =
                "none";


            await cargarModelo();


            estado.innerText =
                "Solicitando acceso a la cámara...";


            webcam =
                new tmImage.Webcam(
                    400,
                    400,
                    true
                );


            await webcam.setup();

            await webcam.play();


            ejecutando = true;


            // Ocultar imagen

            imagen.style.display =
                "none";


            // Mostrar cámara

            document
                .getElementById(
                    "webcam-container"
                )
                .innerHTML = "";


            document
                .getElementById(
                    "webcam-container"
                )
                .appendChild(
                    webcam.canvas
                );


            estado.innerText =
                "📷 Cámara activa. Coloca la fruta frente a la cámara.";


            window.requestAnimationFrame(
                loop
            );

        }

        catch(error) {

            mostrarError(error);

        }

    }


    // =====================================================
    // LOOP DE CÁMARA
    // =====================================================

    async function loop() {

        if (!ejecutando) {

            return;

        }


        webcam.update();


        const predicciones =
            await model.predict(
                webcam.canvas
            );


        mostrarResultados(
            predicciones
        );


        window.requestAnimationFrame(
            loop
        );

    }


    // =====================================================
    // DETENER CÁMARA
    // =====================================================

    function detenerCamara() {

        ejecutando = false;


        if (webcam) {

            webcam.stop();

            webcam = null;

        }


        document
            .getElementById(
                "webcam-container"
            )
            .innerHTML = "";

    }

</script>


</body>

</html>
