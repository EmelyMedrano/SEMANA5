<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Frutas - Semana 5</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #1f2937; margin-bottom: 20px; }
        .container {
            display: flex;
            gap: 30px;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 800px;
            width: 100%;
        }
        .panel-cam {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .panel-resultados {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #webcam-container {
            width: 300px;
            height: 300px;
            background-color: #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d1d5db;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .clase-prediccion {
            margin: 12px 0;
            font-size: 16px;
            font-weight: 500;
        }
        .barra-progreso {
            background-color: #e5e7eb;
            border-radius: 9999px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 4px;
        }
        .progreso-relleno {
            height: 100%;
            width: 0%;
            transition: width 0.1s ease;
        }
         .color-0 { background-color: #ea580c; } /* Frutas Maduras */
        .color-1 { background-color: #10b981; } /* Frutas Verdes */
        .color-2 { background-color: #7c3aed; } /* Frutas Malogradas */
    </style>
</head>
<body>
    <h1>SEMANA 5: Clasificador de Frutas</h1>
    <div class="container">
        <div class="panel-cam">
            <div id="webcam-container"><span>Cámara apagada</span></div>
            <button type="button" onclick="init()">🚀 Iniciar Cámara</button>
        </div>
        <div class="panel-resultados">
            <h3>Resultados del Análisis:</h3>
            <div id="label-container"></div>
        </div>
    </div>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/Gezzx2Ug_/";
        let model, webcam, labelContainer, maxPredictions;
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            const flip = true; 
            webcam = new tmImage.Webcam(300, 300, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; 
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }
        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }
        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const nombreClase = prediction[i].className;
                const porcentaje = (prediction[i].probability * 100).toFixed(1);
                
                // Mostrar nombres de clases y barras dinámicas
                labelContainer.childNodes[i].innerHTML = `
                    <div class="clase-prediccion">
                        <strong>${nombreClase}:</strong> ${porcentaje}%
                        <div class="barra-progreso">
                            <div class="progreso-relleno color-${i}" style="width: ${porcentaje}%"></div>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
