<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Frutas ✨</title>
    <style>
        :root {
            --rosa-principal: #ff7597;
            --rosa-fuerte: #e04f74;
            --rosa-pastel: #fff0f3;
            --coquette-text: #4c1d24;
            --menta: #2ec4b6;
            --lavanda: #b5179e;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #fbcfe8 50%, #f472b6 100%);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--coquette-text);
        }
        
        h1 { 
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px; 
            text-align: center;
            letter-spacing: 1px;
            background: linear-gradient(to right, #9d174d, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: #854d56;
            margin-bottom: 35px;
            font-style: italic;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 35px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.15);
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .panel-izquierdo {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Pestañas */
        .tabs {
            display: flex;
            width: 100%;
            background-color: rgba(255, 241, 242, 0.7);
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 25px;
            border: 1px solid #fbcfe8;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #be185d;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff7597 0%, #db2777 100%);
            color: white;
            box-shadow: 0 8px 16px rgba(219, 39, 119, 0.25);
        }

        .tab-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active { display: flex; }

        .visor-medio {
            width: 100%;
            max-width: 320px;
            height: 320px;
            background-color: #fff1f2;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #f9a8d4;
            position: relative;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        .visor-medio:hover {
            border-color: var(--rosa-fuerte);
            background-color: #ffe4e6;
        }

        .visor-medio span {
            color: #9d174d;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            padding: 25px;
            line-height: 1.5;
        }

        #img-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            display: none;
        }

        /* Botones */
        .btn-principal, .file-label {
            background: linear-gradient(135deg, #ff7597 0%, #e04f74 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 6px 20px rgba(224, 79, 116, 0.3);
            transition: all 0.3s ease;
            text-align: center;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .btn-principal:hover, .file-label:hover { 
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(224, 79, 116, 0.45);
        }

        #file-input { display: none; }

        /* Cuadro de Resultados */
        .panel-resultados {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #ffffff 0%, #fff5f6 100%);
            border-radius: 22px;
            padding: 25px;
            border: 1px solid #fbcfe8;
            box-shadow: 0 10px 30px rgba(157, 23, 77, 0.05);
            align-self: center;
            width: 100%;
            box-sizing: border-box;
        }

        .panel-resultados h3 {
            color: #702431;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .clase-prediccion {
            margin: 20px 0;
            font-size: 14px;
            color: var(--coquette-text);
            font-weight: 600;
        }

        .label-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .barra-progreso {
            background-color: #fff1f2;
            border-radius: 9999px;
            height: 16px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #ffe4e6;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        .progreso-relleno {
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .color-0 { background: linear-gradient(90deg, #ff4d6d, #ffb3c1); } 
        .color-1 { background: linear-gradient(90deg, #2ec4b6, #cbf3f0); } 
        .color-2 { background: linear-gradient(90deg, #9b5de5, #f1c0e8); } 

        /* Botones Extras */
        .extra-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 30px;
            justify-content: center;
        }

        .btn-extra {
            background: white;
            border: 1px solid #fbcfe8;
            color: #be185d;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .btn-extra:hover {
            background-color: #fff1f2;
            border-color: #f472b6;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; gap: 30px; padding: 25px; }
            body { padding: 20px 12px; }
            .visor-medio { max-width: 100%; }
            .extra-buttons { flex-wrap: wrap; }
            .btn-extra { flex: 1 1 40%; text-align: center; }
        }
    </style>
</head>
<body>

    <h1>Clasificador de Frutas ✨</h1>
    <div class="subtitle">Análisis inteligente con Inteligencia Artificial</div>

    <div class="container">
        <!-- Panel Izquierdo -->
        <div class="panel-izquierdo">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'cam-tab')">📷 Escaneo en Vivo</button>
                <button class="tab-btn" onclick="switchTab(event, 'file-tab')">📁 Subir Archivo</button>
            </div>

            <!-- Pestaña Cámara -->
            <div id="cam-tab" class="tab-content active">
                <div id="webcam-container" class="visor-medio"><span>🌸 Lista para encender tu cámara en alta definición</span></div>
                <button type="button" class="btn-principal" onclick="initWebcam()">✨ Activar Escáner</button>
            </div>

            <!-- Pestaña Archivo -->
            <div id="file-tab" class="tab-content">
                <div class="visor-medio">
                    <span id="file-text">🌸 Selecciona una fotografía de tus frutas</span>
                    <img id="img-preview" alt="Predicción">
                </div>
                <label for="file-input" class="file-label">🖼️ Examinar Galería</label>
                <input type="file" id="file-input" accept="image/*" onchange="previewAndPredict(event)">
            </div>
        </div>

        <!-- Panel Derecho -->
        <div class="panel-resultados">
            <h3>🎀 Diagnóstico de Calidad</h3>
            <div id="label-container">
                <div style="text-align: center; color: #a1626c; font-size: 13px; padding: 40px 0;">
                    Esperando que actives la cámara o subas una foto para revelar el análisis...
                </div>
            </div>
        </div>
    </div>
