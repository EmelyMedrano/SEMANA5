<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evaluación de Frutas</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff5df, #f8fff8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #555;
            margin-bottom: 25px;
        }

        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
        }

        button:hover {
            background-color: #1b5e20;
        }

        #webcam-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        canvas {
            border-radius: 15px;
            max-width: 100%;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background-color: #f1f8e9;
        }

        #resultado h2 {
            margin: 0;
            color: #2e7d32;
        }

        #predicciones {
            margin-top: 20px;
            text-align: left;
        }

        .prediccion {
            margin: 12px 0;
        }

        .barra {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progreso {
            height: 100%;
            background-color: #4caf50;
            border-radius: 10px;
        }

        #estado {
            margin-top: 15px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>🍎 Evaluación de Frutas</h1>

        <p class="descripcion">
            Coloca una fruta frente a la cámara y el sistema determinará
            su estado.
        </p>

        <button onclick="iniciarCamara()">
            📷 Iniciar cámara
        </button>

        <button onclick="detenerCamara()">
            ⛔ Detener cámara
        </button>

        <div id="estado">
            Presiona "Iniciar cámara" para comenzar.
        </div>

        <div id="webcam-container"></div>

        <div id="resultado">
            <h2>Resultado</h2>
            <p id="resultadoTexto">
                Esperando una fruta...
            </p>
        </div>

        <div id="predicciones"></div>

    </div>


    <script>

        // ==========================================
        // CONFIGURACIÓN DEL MODELO
        // ==========================================

        const URL =
            "https://teachablemachine.withgoogle.com/models/Gezzx2Ug_/";

        let model;
        let webcam;
        let maxPredictions;
        let ejecutando = false;


        // ==========================================
        // INICIAR CÁMARA
        // ==========================================

        async function iniciarCamara() {

            try {

                document.getElementById("estado").innerText =
                    "Cargando modelo...";

                // Ubicación del modelo
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // Cargar modelo
                model = await tmImage.load(
                    modelURL,
                    metadataURL
                );

                maxPredictions = model.getTotalClasses();

                // Crear cámara
                webcam = new tmImage.Webcam(
                    400,
                    400,
                    true
                );

                await webcam.setup();

                await webcam.play();

                ejecutando = true;

                document
                    .getElementById("webcam-container")
                    .innerHTML = "";

                document
                    .getElementById("webcam-container")
                    .appendChild(webcam.canvas);

                document.getElementById("estado").innerText =
                    "Cámara activa. Coloca una fruta frente a la cámara.";

                // Iniciar reconocimiento
                window.requestAnimationFrame(loop);

            } catch (error) {

                console.error(error);

                document.getElementById("estado").innerText =
                    "No se pudo iniciar la cámara. Verifica los permisos.";
            }
        }


        // ==========================================
        // BUCLE DE RECONOCIMIENTO
        // ==========================================

        async function loop() {

            if (!ejecutando) {
                return;
            }

            webcam.update();

            await predecir();

            window.requestAnimationFrame(loop);
        }


        // ==========================================
        // REALIZAR PREDICCIÓN
        // ==========================================

        async function predecir() {

            const predicciones =
                await model.predict(webcam.canvas);

            let claseMayor = "";
            let porcentajeMayor = 0;

            const contenedor =
                document.getElementById("predicciones");

            contenedor.innerHTML = "";

            for (
                let i = 0;
                i < maxPredictions;
                i++
            ) {

                const nombre =
                    predicciones[i].className;

                const porcentaje =
                    predicciones[i].probability * 100;


                // Buscar la clase con mayor probabilidad

                if (
                    predicciones[i].probability >
                    porcentajeMayor
                ) {

                    porcentajeMayor =
                        predicciones[i].probability;

                    claseMayor =
                        nombre;
                }


                // Crear resultado visual

                const div =
                    document.createElement("div");

                div.className = "prediccion";

                div.innerHTML = `
                    <strong>
                        ${nombre}: ${porcentaje.toFixed(2)}%
                    </strong>

                    <div class="barra">
                        <div
                            class="progreso"
                            style="width: ${porcentaje}%">
                        </div>
                    </div>
                `;

                contenedor.appendChild(div);
            }


            // Mostrar resultado principal

            document.getElementById("resultadoTexto").innerHTML =
                `<strong>${claseMayor}</strong>
                <br>
                Confianza:
                ${(porcentajeMayor * 100).toFixed(2)}%`;
        }


        // ==========================================
        // DETENER CÁMARA
        // ==========================================

        function detenerCamara() {

            ejecutando = false;

            if (webcam) {

                webcam.stop();

                document
                    .getElementById("webcam-container")
                    .innerHTML = "";
            }

            document.getElementById("estado").innerText =
                "Cámara detenida.";

            document.getElementById("resultadoTexto").innerText =
                "Esperando una fruta...";

            document.getElementById("predicciones").innerHTML =
                "";
        }

    </script>

</body>
</html>
