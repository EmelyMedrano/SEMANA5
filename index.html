<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Calidad - Frutas ✨</title>
    <style>
        :root {
            --rosa-principal: #ff7597;
            --rosa-fuerte: #e04f74;
            --rosa-pastel: #fff0f3;
            --coquette-text: #4c1d24;
            --fbcfe8: #fbcfe8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #fbcfe8 50%, #f472b6 100%);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--coquette-text);
            box-sizing: border-box;
        }

        /* Etiqueta superior estilo coquette */
        .badge-lote {
            background-color: rgba(255, 241, 242, 0.8);
            color: #be185d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 50px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid var(--fbcfe8);
            box-shadow: 0 2px 10px rgba(219, 39, 119, 0.05);
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 34px;
            font-weight: 700;
            margin: 0 0 10px 0;
            text-align: center;
            background: linear-gradient(to right, #9d174d, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .instrucciones {
            font-size: 14px;
            line-height: 1.6;
            color: #854d56;
            text-align: center;
            max-width: 450px;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Tarjeta principal con efecto cristal */
        .card-control {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.12);
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        /* Botones de pestañas */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background-color: rgba(255, 241, 242, 0.6);
            border-radius: 50px;
            padding: 4px;
            border: 1px solid var(--fbcfe8);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #be185d;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff7597 0%, #db2777 100%);
            color: white;
            box-shadow: 0 6px 14px rgba(219, 39, 119, 0.2);
        }

        .tab-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* Zona interactiva punteada rosa */
        .drop-zone {
            width: 100%;
            height: 160px;
            background-color: #fff1f2;
            border: 2px dashed #f9a8d4;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .drop-zone:hover {
            background-color: #ffe4e6;
            border-color: var(--rosa-fuerte);
            transform: scale(1.01);
        }

        .drop-zone p {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: #be185d;
        }

        .drop-zone span {
            font-size: 12px;
            color: #9d174d;
            margin-top: 4px;
        }

        /* Visor de imágenes */
        .visor-marco {
            width: 100%;
            height: 240px;
            background-color: #fff1f2;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--fbcfe8);
        }

        #img-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* Botón glamuroso rosa */
        .btn-accion {
            width: 100%;
            background: linear-gradient(135deg, #ff7597 0%, #e04f74 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(224, 79, 116, 0.3);
            transition: all 0.3s ease;
        }

        .btn-accion:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(224, 79, 116, 0.45);
        }

        #file-input {
            display: none;
        }

        /* Resultados */
        .resultados-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f2eae5;
            width: 100%;
        }

        .estado-modelo {
            font-size: 12px;
            color: #a1626c;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }

        .clase-resultado {
            margin: 16px 0;
        }

        .label-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .barra-bg {
            background-color: #fff1f2;
            height: 12px;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid #ffe4e6;
        }

        .barra-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Colores con vibra del análisis */
        .color-0 { background: linear-gradient(90deg, #ff4d6d, #ffb3c1); } /* Maduras: Rosa Fresa */
        .color-1 { background: linear-gradient(90deg, #2ec4b6, #cbf3f0); } /* Verdes: Menta Glow */
        .color-2 { background: linear-gradient(90deg, #9b5de5, #f1c0e8); } /* Malogradas: Lavanda Pop */
    </style>
</head>
<body>

    <div class="badge-lote">Estación de Control · Lote de Manzanas</div>

    <h1>¿Buena o mala?</h1>
    
    <div class="instrucciones">
        Sube una foto de una manzana (o usa la cámara) y el modelo entrenado indicará si pasa el control de calidad.
    </div>

    <div class="card-control">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'file-tab')">📁 Subir Archivo</button>
            <button class="tab-btn" onclick="switchTab(event, 'cam-tab')">📷 Usar Cámara</button>
        </div>

        <!-- Modo Archivo -->
        <div id="file-tab" class="tab-content active">
            <div class="drop-zone" onclick="document.getElementById('file-input').click()">
                <p>🌸 Toca para elegir una foto</p>
                <span>o arrástrala aquí</span>
            </div>
            <input type="file" id="file-input" accept="image/*" onchange="previewAndPredict(event)">
            
            <div class="visor-marco" style="margin-top: 20px; display: none;" id="marco-preview">
                <img id="img-preview" alt="Predicción">
            </div>
        </div>

        <!-- Modo Cámara -->
        <div id="cam-tab" class="tab-content">
            <div id="webcam-container" class="visor-marco">
                <span style="font-size: 13px; color: #9c857f;">🌸 Cámara en reposo.</span>
            </div>
            <button type="button" class="btn-accion" onclick="initWebcam()">✨ Activar cámara en vivo</button>
        </div>

        <!-- Resultados -->
        <div class="resultados-box">
            <div class="estado-modelo" id="status-text">Modelo listo.</div>
            <div id="label-container"></div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
