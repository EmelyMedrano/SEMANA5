<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evaluación de Frutas</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff5df, #f8fff8);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .contenedor {
            width: 100%;
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #2e7d32;
        }

        .descripcion {
            color: #555;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .rojo {
            background: #c62828;
        }

        .rojo:hover {
            background: #8e0000;
        }

        /* ZONA DE ARRASTRAR */

        .zona-drop {
            border: 3px dashed #4caf50;
            border-radius: 15px;
            padding: 35px 20px;
            margin: 20px 0;
            background: #f8fff8;
            cursor: pointer;
            transition: 0.3s;
        }

        .zona-drop:hover {
            background: #e8f5e9;
        }

        .zona-drop.activa {
            background: #c8e6c9;
            border-color: #1b5e20;
        }

        .icono {
            font-size: 45px;
        }

        /* IMAGEN */

        #imagen {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
        }

        /* CANVAS DE CÁMARA */

        #webcam-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        canvas {
            max-width: 100%;
            border-radius: 15px;
        }

        /* RESULTADO */

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: #f1f8e9;
        }

        #resultadoTexto {
            font-size: 25px;
            font-weight: bold;
        }

        .verde {
            background: #e8f5e9 !important;
            color: #2e7d32;
        }

        .amarillo {
            background: #fff8e1 !important;
            color: #f57f17;
        }

        .malograda {
            background: #ffebee !important;
            color: #c62828;
        }

        /* PORCENTAJES */

        #predicciones {
            margin-top: 20px;
            text-align: left;
        }

        .prediccion {
            margin: 15px 0;
        }

        .barra {
            height: 20px;
            width: 100%;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progreso {
            height: 100%;
            background: #4caf50;
            border-radius: 10px;
        }

        #estado {
            color: #666;
            margin: 15px;
        }

        #error {
            color: #c62828;
            background: #ffebee;
            padding: 12px;
            border-radius: 10px;
            display: none;
            margin-top: 15px;
        }

        @media(max-width:600px) {

            .contenedor {
                padding: 20px;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="contenedor">

    <h1>🍎 Evaluación de Frutas</h1>

    <p class="descripcion">
        Sube una imagen, arrástrala al área indicada
        o utiliza la cámara para evaluar la fruta.
    </p>


    <!-- BOTONES -->

    <div class="botones">

        <button onclick="seleccionarImagen()">
            🖼️ Subir imagen
        </button>

        <button onclick="iniciarCamara()">
            📷 Usar cámara
        </button>

        <button class="rojo" onclick="detenerCamara()">
            ⛔ Detener cámara
        </button>

    </div>


    <!-- INPUT -->

    <input
        type="file"
        id="archivo"
        accept="image/*"
        style="display:none"
    >


    <!-- DRAG AND DROP -->

    <div id="zonaDrop" class="zona-drop">

        <div class="icono">
            📤
        </div>

        <h3>
            Arrastra una imagen aquí
        </h3>

        <p>
            También puedes hacer clic para seleccionar una imagen
        </p>

        <p>
            JPG · PNG · JPEG · WEBP
        </p>

    </div>


    <p id="estado">
        Esperando una imagen...
    </p>


    <!-- IMAGEN -->

    <img id="imagen" alt="Fruta">


    <!-- CÁMARA -->

    <div id="webcam-container"></div>


    <!-- RESULTADO -->

    <div id="resultado">

        <h2>Resultado</h2>

        <p id="resultadoTexto">
            Esperando una fruta...
        </p>

    </div>


    <!-- PREDICCIONES -->

    <div id="predicciones"></div>


    <!-- ERROR -->

    <div id="error"></div>


</div>


<script>

    // =====================================================
    // MODELO DE TEACHABLE MACHINE
    // =====================================================

    const URL =
        "https://teachablemachine.withgoogle.com/models/Gezzx2Ug_/";


    let model = null;

    let maxPredictions = 0;

    let webcam = null;

    let ejecutando = false;


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const archivo =
        document.getElementById("archivo");

    const zonaDrop =
        document.getElementById("zonaDrop");

    const imagen =
        document.getElementById("imagen");

    const estado =
        document.getElementById("estado");

    const errorElemento =
        document.getElementById("error");


    // =====================================================
    // MOSTRAR ERROR
    // =====================================================

    function mostrarError(error) {

        console.error(error);

        errorElemento.style.display = "block";

        errorElemento.innerText =
            "Error: " + error.message;

        estado.innerText =
            "No se pudo analizar la imagen.";

    }


    // =====================================================
    // CARGAR MODELO
    // =====================================================

    async function cargarModelo() {

        if (model !== null) {
            return;
        }

        estado.innerText =
            "Cargando modelo de inteligencia artificial...";


        const modelURL =
            URL + "model.json";

        const metadataURL =
            URL + "metadata.json";


        model = await tmImage.load(
            modelURL,
            metadataURL
        );


        maxPredictions =
            model.getTotalClasses();


        console.log(
            "Modelo cargado correctamente."
        );

        console.log(
            "Número de clases:",
            maxPredictions
        );

    }


    // =====================================================
    // SELECCIONAR IMAGEN
    // =====================================================

    function seleccionarImagen() {

        archivo.click();

    }


    archivo.addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (file) {

                procesarImagen(file);

            }

        }
    );


    // =====================================================
    // PROCESAR IMAGEN
    // =====================================================

    async function procesarImagen(file) {

        try {

            errorElemento.style.display =
                "none";


            // Comprobar que sea imagen

            if (!file.type.startsWith("image/")) {

                throw new Error(
                    "El archivo seleccionado no es una imagen."
                );

            }


            // Detener cámara

            detenerCamara();


            // Cargar modelo

            await cargarModelo();


            estado.innerText =
                "Cargando imagen...";


            // Crear URL

            const url =
                URL.createObjectURL(file);


            // Asignar imagen

            imagen.src = url;

            imagen.style.display =
                "block";


            // Esperar carga

            await new Promise(
                function(resolve, reject) {

                    imagen.onload = resolve;

                    imagen.onerror = function() {

                        reject(
                            new Error(
                                "No se pudo cargar la imagen."
                            )
                        );

                    };

                }
            );


            estado.innerText =
                "Analizando fruta...";


            // =================================================
            // CREAR CANVAS
            // =================================================

            const canvas =
                document.createElement("canvas");


            const contexto =
                canvas.getContext("2d");


            const ancho =
                imagen.naturalWidth;

            const alto =
                imagen.naturalHeight;


            canvas.width = ancho;

            canvas.height = alto;


            contexto.drawImage(
                imagen,
                0,
                0,
                ancho,
                alto
            );


            // =================================================
            // PREDICCIÓN
            // =================================================

            const predicciones =
                await model.predict(canvas);


            mostrarResultados(
                predicciones
            );


            estado.innerText =
                "✅ Evaluación completada.";


            // Liberar URL

            URL.revokeObjectURL(url);

        }

        catch(error) {

            mostrarError(error);

        }

    }


    // =====================================================
    // MOSTRAR RESULTADOS
    // =====================================================

    function mostrarResultados(predicciones) {

        let claseMayor = "";

        let confianzaMayor = 0;


        const contenedor =
            document.getElementById(
                "predicciones"
            );


        contenedor.innerHTML = "";


        for (
            let i = 0;
            i < predicciones.length;
            i++
        ) {

            const nombre =
                predicciones[i].className;


            const confianza =
                predicciones[i].probability;


            const porcentaje =
                confianza * 100;


            // Buscar mayor

            if (
                confianza >
                confianzaMayor
            ) {

                confianzaMayor =
                    confianza;

                claseMayor =
                    nombre;

            }


            // Crear barra

            const div =
                document.createElement("div");


            div.className =
                "prediccion";


            div.innerHTML = `

                <strong>
                    ${nombre}
                    -
                    ${porcentaje.toFixed(2)}%
                </strong>

                <div class="barra">

                    <div
                        class="progreso"
                        style="width:${porcentaje}%">
                    </div>

                </div>

            `;


            contenedor.appendChild(div);

        }


        mostrarResultadoPrincipal(
            claseMayor,
            confianzaMayor
        );

    }


    // =====================================================
    // RESULTADO PRINCIPAL
    // =====================================================

    function mostrarResultadoPrincipal(
        clase,
        confianza
    ) {

        const resultado =
            document.getElementById(
                "resultado"
            );


        const texto =
            document.getElementById(
                "resultadoTexto"
            );


        resultado.classList.remove(
            "verde",
            "amarillo",
            "malograda"
        );


        const nombre =
            clase.toLowerCase();


        // MALOGRADA

        if (
            nombre.includes("malograd") ||
            nombre.includes("podrid") ||
            nombre.includes("dañad")
        ) {

            resultado.classList.add(
                "malograda"
            );


            texto.innerHTML = `
                🔴 ${clase}
                <br>
                <small>
                    Confianza:
                    ${(confianza * 100).toFixed(2)}%
                </small>
            `;

        }


        // VERDE

        else if (
            nombre.includes("verde")
        ) {

            resultado.classList.add(
                "verde"
            );


            texto.innerHTML = `
                🟢 ${clase}
                <br>
                <small>
                    Confianza:
                    ${(confianza * 100).toFixed(2)}%
                </small>
            `;

        }


        // SIN MADURAR / OTRA CLASE

        else {

            resultado.classList.add(
                "amarillo"
            );


            texto.innerHTML = `
                🟡 ${clase}
                <br>
                <small>
                    Confianza:
                    ${(confianza * 100).toFixed(2)}%
                </small>
            `;

        }

    }


    // =====================================================
    // DRAG & DROP
    // =====================================================

    zonaDrop.addEventListener(
        "click",
        seleccionarImagen
    );


    zonaDrop.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();

            zonaDrop.classList.add(
                "activa"
            );

        }
    );


    zonaDrop.addEventListener(
        "dragleave",
        function() {

            zonaDrop.classList.remove(
                "activa"
            );

        }
    );


    zonaDrop.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();


            zonaDrop.classList.remove(
                "activa"
            );


            const files =
                event.dataTransfer.files;


            if (files.length === 0) {
                return;
            }


            procesarImagen(
                files[0]
            );

        }
    );


    // =====================================================
    // CÁMARA
    // =====================================================

    async function iniciarCamara() {

        try {

            errorElemento.style.display =
                "none";


            await cargarModelo();


            estado.innerText =
                "Solicitando acceso a la cámara...";


            webcam =
                new tmImage.Webcam(
                    400,
                    400,
                    true
                );


            await webcam.setup();

            await webcam.play();


            ejecutando = true;


            imagen.style.display =
                "none";


            document
                .getElementById(
                    "webcam-container"
                )
                .innerHTML = "";


            document
                .getElementById(
                    "webcam-container"
                )
                .appendChild(
                    webcam.canvas
                );


            estado.innerText =
                "📷 Cámara activa.";


            window.requestAnimationFrame(
                loop
            );

        }

        catch(error) {

            mostrarError(error);

        }

    }


    // =====================================================
    // LOOP DE CÁMARA
    // =====================================================

    async function loop() {

        if (!ejecutando) {
            return;
        }


        webcam.update();


        const predicciones =
            await model.predict(
                webcam.canvas
            );


        mostrarResultados(
            predicciones
        );


        window.requestAnimationFrame(
            loop
        );

    }


    // =====================================================
    // DETENER CÁMARA
    // =====================================================

    function detenerCamara() {

        ejecutando = false;


        if (webcam) {

            webcam.stop();

            webcam = null;

        }


        document
            .getElementById(
                "webcam-container"
            )
            .innerHTML = "";

    }

</script>


</body>

</html>
